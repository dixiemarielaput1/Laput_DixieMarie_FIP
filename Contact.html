<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sanchez&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/d0e8431583.js" crossorigin="anonymous"></script>
    <link href="css/grid.css" rel="stylesheet">
    <link href="css/main.css" rel="stylesheet">
    <title>Billy Beer Website</title>
</head>
    <body>
        <h1 class="hidden">Billy Beer</h1>
        <div id="sticky-nav-con">
            <header class="grid-con" id="main-header">
                <nav id="main-nav" class="col-span-full m-col-start-4 m-col-end-11">
                    <h2 class="hidden">Main Navigation</h2>
                    <button id="button"></button>
                    <div id="burger-con">
                        <ul>
                            <li><a href="index.html">Home</a></li>
                          
                            <li><a href="Product-renew.html">Products</a></li>
                            <li><a href="Contact.html">Contact</a></li>
   
                        </ul>
                    </div>
                </nav>
                <div id="logo" class="col-span-full m-col-start-1 m-col-end-4">
                    <img src="images/fiplogo-1.png" alt="Couples Resort Logo">
                </div>
                <div id="book-now-header" class="book-now col-span-2">
                    <img src="images/icons8-shopping-bag-100.png" alt="">
                </div>
            </header>
        </div>

        
        <div class="contact-renew-header grid-con">
            <h2 class="l-col-span-12 m-col-span-12 col-span-4">CONTACT US</h2>
            <p class="l-col-span-12 m-col-span-12 col-span-4">There are many beer variations to come this season.</p>
        </div>

        <div class="contact-container grid-con">
        <div class="contact-section l-col-span-12 m-col-span-4 col-span-4" >
            <h3>We’d like to hear from you!</h3>
            <form action="#" method="POST">
                <div class="grid-container">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
    
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
    
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
    
                    <button type="submit" class="btn-renew-black">Submit</button>
                </div>
            </form>
        </div>
        </div>


    
    <footer>
        <div class="main-container-footer grid-con">
  

        <div class="social-media l-col-span-12 m-col-span-12 col-span-4">
            <img src="images/icons_insta.svg" alt="Instagram" id="insta">
            <img src="images/icons_facebook.svg" alt="Facebook" id="facebook">
            <img src="images/icons_twitter.svg" alt="Twitter" id="twitter">
        </div>

   

        <div class="footer-end l-col-span-12 m-col-span-12 col-span-4">
            <p>© 2024, Billy Beer.</p>
            <p>Refund Policy | Terms of Service | Privacy Policy</p>
        </div>

    </div>

    </footer>



















        <script src="js/main.js"></script>   
    </body>
</html>
